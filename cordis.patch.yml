# dsh-plugin-license-manager — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "licenses".
# Tools resultantes: mcp__licenses__* (ver README).
- insert:
    - id: mcp-license-manager
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: licenses
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/license-manager/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
